name: Audit build

on:
  push:
    branches: [audit-fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out exact revision without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject retired patch requests
        shell: pwsh
        run: |
          if (Test-Path .audit-patch-request.json) {
            throw 'The compilation-only patch writer has been retired. Use reviewed source commits or the regression-gated repair workflow.'
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build Debug solution
        shell: pwsh
        run: |
          msbuild youtube-dl-gui.sln /m /p:Configuration=Debug '/p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release updater
        shell: pwsh
        run: |
          msbuild youtube-dl-gui-updater/youtube-dl-gui-updater.csproj /m /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release application
        shell: pwsh
        run: |
          msbuild youtube-dl-gui/youtube-dl-gui.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:BuildProjectReferences=false /p:PreBuildEvent= /p:PostBuildEvent=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
