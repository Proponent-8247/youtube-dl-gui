name: Guarded audit repairs (read-only evidence)
# Verification must never carry repository write credentials or automatically publish
# build-derived artifacts. Independently review and merge the proposed changes.
on:
  push:
    branches:
      - feature/download-history-archive-3.3.0-2
    paths:
      - .audit-repairs.json
      - '.audit-repairs.parts/**'
permissions:
  contents: read
concurrency:
  group: audit-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repair:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Reject superseded or duplicate requests
        id: head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'audit-repair-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $allowedBranches = @('audit-fixes', 'feature/download-history-archive-3.3.0-2')
          if ($env:GITHUB_REF_NAME -notin $allowedBranches) { throw 'Guarded repairs are not permitted on this branch.' }
          $remote = @(git ls-remote origin "refs/heads/$env:GITHUB_REF_NAME")
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1) { throw 'Could not verify the current repair head.' }
          $current = (($remote[0] -split '\s+')[0] -eq $env:GITHUB_SHA)
          "current=$current" >> $env:GITHUB_OUTPUT
          if (!$current) {
            'Superseded request: the branch moved. This run made no source changes.' | Set-Content (Join-Path $evidence 'status.txt')
          }
      - name: Prove repair job cannot authenticate repository writes
        if: steps.head.outputs.current == 'True'
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
        run: |
          $ErrorActionPreference = 'Stop'
          if (![string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw 'Guarded repair code must not receive GITHUB_TOKEN.'
          }
          # This is an intentionally hostile build target. A push dry-run never
          # creates a ref, and should fail authentication with checkout credentials off.
          $output = & msbuild tests/AuditSecurityCredentialProbe.proj /t:Probe /nologo /v:minimal 2>&1 | Out-String
          $exit = $LASTEXITCODE
          $output | Out-Host
          if ($exit -ne 0 -or $output -notmatch 'Hostile MSBuild dry-run push refused') {
            throw "Repair credential-denial probe failed (exit $exit)."
          }
          if ($output -notmatch '(?i)(403|401|permission denied|write access|authentication failed|could not read username|cannot prompt because user interactivity has been disabled|unable to get password from user|terminal prompts disabled|not granted|access denied|insufficient permissions)') {
            throw 'Unexpected dry-run failure; repository credential isolation was not proven.'
          }
      - name: Build, test and commit each exact repair
        if: steps.head.outputs.current == 'True'
        shell: pwsh
        run: ./tools/Run-AuditRepairBatch.ps1 -EvidenceDirectory '${{ runner.temp }}/audit-repair-evidence'
      - name: Retain read-only verification evidence (manual review required)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-repairs-${{ github.sha }}
          path: ${{ runner.temp }}/audit-repair-evidence/
          if-no-files-found: error
          retention-days: 14