name: Audit finding characterization

on:
  push:
    branches: [audit-fixes]
    paths: ['audit/repro/**', '.github/workflows/audit-observations.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Build unchanged application
        shell: pwsh
        run: |
          msbuild youtube-dl-gui.sln /m /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe isolated known defects, not remediation success
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'review-observations'
          New-Item -ItemType Directory $out | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $exe = Join-Path $out 'ReviewObservations.exe'
          $source = (Resolve-Path 'audit\repro\ReviewObservations.cs').Path
          & $compiler /nologo /langversion:5 /target:exe "/out:$exe" /reference:System.Core.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll $source 2>&1 | Tee-Object (Join-Path $out 'compiler.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Join-Path $PWD 'youtube-dl-gui\bin\Release\youtube-dl-gui.exe'
          $results = @()
          foreach ($case in @('batch-quotes','duration-rounding','duration-budget','time-span','time-width','time-malformed','format-boundary','configured-schema')) {
            $scratch = Join-Path $env:RUNNER_TEMP ('review-' + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory $scratch | Out-Null
            $stdout = Join-Path $out "$case.txt"
            $stderr = Join-Path $out "$case.stderr.txt"
            $process = Start-Process $exe -ArgumentList @("`"$app`"", $case) -WorkingDirectory $scratch -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $timedOut = $false
            try {
              if (!$process.WaitForExit(8000)) {
                $timedOut = $true
                & taskkill.exe /PID $process.Id /T /F | Out-Host
                $process.WaitForExit(5000) | Out-Null
                $code = 124
              } else { $process.WaitForExit(); $code = $process.ExitCode }
            } finally { $process.Dispose() }
            $text = [string](Get-Content $stdout -Raw)
            $observed = ($code -eq 42) -or ($case -eq 'duration-budget' -and $timedOut -and $text.Contains('ENTER_DURATION_GETTER'))
            $results += [ordered]@{ case=$case; defect_observed=$observed; exit_code=$code; timed_out=$timedOut; output=$text }
            Write-Host "$case : defect_observed=$observed exit=$code"
            Write-Host $text
            Remove-Item $scratch -Recurse -Force
          }
          [ordered]@{ revision=$env:GITHUB_SHA; purpose='Characterization of existing defects; NOT a passing remediation suite'; results=$results } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'observations.json')
          if (@($results | Where-Object { !$_.defect_observed }).Count -gt 0) { throw 'Some expected observations were not established. Inspect probe output rather than claiming reproduction.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-observations-${{ github.sha }}
          path: review-observations/
          if-no-files-found: error
          retention-days: 30
