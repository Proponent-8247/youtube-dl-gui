name: Release candidate smoke (read-only, nonpublishing)

on:
  push:
    branches:
      - remediation/whole-repo-20261016
    paths:
      - '.github/workflows/release-candidate-smoke.yml'
      - 'tools/Build-ReleaseCandidate.ps1'
      - 'tools/Assert-ReleaseCandidateInventory.ps1'
      - 'tests/AuditRegression.ReleaseInventory.cs'
      - 'tests/AuditRegression.ReproducibleZip.cs'
      - 'youtube-dl-gui/youtube-dl-gui.csproj'
      - 'tools/New-DeterministicReleaseZip.ps1'
      - 'youtube-dl-gui-updater/Forms/frmUpdater.cs'
      - 'youtube-dl-gui/Controls/MessageHandler.cs'
      - 'Controls/CopyData.cs'
      - 'tests/AuditRegression.UpdaterIpcE2E.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify complete candidate, never publish
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out exactly the candidate revision without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
        with:
          msbuild-architecture: x86

      - name: Execute complete release candidate build and all regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/Build-ReleaseCandidate.ps1 -ExpectedVersion '3.3.0-2' -EvidenceDirectory "$PWD/release-smoke-evidence"
          if (!$?) { throw 'Release candidate smoke failed before completion.' }

      - name: Independently recheck upload inventory and candidate head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath ./Release/Release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -cne $env:GITHUB_SHA) {
            throw 'Smoke candidate manifest commit does not equal checkout SHA.'
          }
          & ./tools/Assert-ReleaseCandidateInventory.ps1 -ReleaseRoot ./Release -ExpectedVersion $manifest.version
          if (!$?) { throw 'The exact payload inventory failed post-build verification.' }
          Write-Host 'Nonpublishing candidate is internally consistent.'

      - name: Retain nonpublishing candidate for independent inspection
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: read-only-release-smoke-${{ github.sha }}
          path: Release/
          if-no-files-found: error
          retention-days: 14

      - name: Retain test evidence regardless of outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-smoke-evidence-${{ github.sha }}
          path: release-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
