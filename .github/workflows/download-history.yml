name: Download history verification

on:
  push:
    branches: [feature/download-history-20260908]
  pull_request:
    branches: [audit-fixes, master]
  workflow_dispatch:

concurrency:
  group: download-history-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject unfinished development patch requests
        shell: pwsh
        run: |
          if (Test-Path '.history-change.json') { throw 'An unfinished development patch is not a deliverable source revision.' }
          git -c core.whitespace=cr-at-eol diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Build debug application
        run: msbuild youtube-dl-gui\youtube-dl-gui.csproj /m /p:Configuration=Debug /p:Platform=AnyCPU
      - name: Build debug updater
        run: msbuild youtube-dl-gui-updater\youtube-dl-gui-updater.csproj /m /p:Configuration=Debug /p:Platform=AnyCPU
      - name: Build debug solution
        run: msbuild youtube-dl-gui.sln /m /p:Configuration=Debug "/p:Platform=Any CPU"
      - name: Build release updater
        run: msbuild youtube-dl-gui-updater\youtube-dl-gui-updater.csproj /m /p:Configuration=Release /p:Platform=AnyCPU
      - name: Build release application
        run: msbuild youtube-dl-gui\youtube-dl-gui.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:BuildProjectReferences=false /p:PreBuildEvent= /p:PostBuildEvent=
      - name: Run download history regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-evidence | Out-Null
          msbuild tests\DownloadHistory.Tests\DownloadHistory.Tests.csproj /m /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests\DownloadHistory.Tests\bin\Release\DownloadHistory.Tests.exe | Tee-Object -FilePath test-evidence\core-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up Python for offline integration tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned native downloader test dependency
        run: python -m pip install --disable-pip-version-check yt-dlp==2026.6.9
      - name: Exercise built application with native yt-dlp and render Settings
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & tests\DownloadHistory.Tests\bin\Release\DownloadHistory.Tests.exe --native-suite youtube-dl-gui\bin\Release\youtube-dl-gui.exe $python tests\DownloadHistory.Tests\native_fixture.py test-evidence | Tee-Object -FilePath test-evidence\native-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export exact source snapshot
        if: always()
        shell: pwsh
        run: |
          git rev-parse HEAD | Out-File -Encoding ascii tested-revision.txt
          git -c core.autocrlf=false archive --format=zip --output=source-snapshot.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain source and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.sha }}
          path: |
            source-snapshot.zip
            tested-revision.txt
            test-evidence/
          retention-days: 7
      - name: Retain verified release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: download-history-${{ github.sha }}
          path: |
            youtube-dl-gui/bin/Release/
            youtube-dl-gui-updater/bin/Release/
            tested-revision.txt
          retention-days: 7
